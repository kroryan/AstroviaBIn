# AstroviaBin Docker Compose Configuration (SQLite — no external database needed)
#
# Usage: docker compose up -d
#
# For PostgreSQL instead of SQLite, layer the postgres override:
#   docker compose -f docker-compose.yml -f docker-compose.postgres.yml up -d

services:
  astroviabin:
    build: .
    container_name: astroviabin
    restart: unless-stopped
    ports:
      - "${ASTROVIABIN_PORT:-5000}:5000"
    environment:
      - NODE_ENV=production
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - SQLITE_DB_PATH=/app/config/astroviabin.db
      - XMP_SIDECAR_PATH=/app/sidecars
      - LIBRARY_STORAGE_DIR=/app/library
      - TILE_CACHE_DIR=/app/cache/deep-zoom
      - THUMBNAIL_CACHE_DIR=/app/cache/thumbnails
      - ASTROMETRY_INDEX_DIR=/usr/share/astrometry
      - ASTROMETRY_SCALE_LOW_ARCMIN=${ASTROMETRY_SCALE_LOW_ARCMIN:-5}
      - ASTROMETRY_SCALE_HIGH_ARCMIN=${ASTROMETRY_SCALE_HIGH_ARCMIN:-2000}
      - AUTO_DB_MIGRATE_FROM=${AUTO_DB_MIGRATE_FROM:-}
      - AUTO_DB_MIGRATE_TO=${AUTO_DB_MIGRATE_TO:-}
      - AUTO_DB_MIGRATE_ONCE=${AUTO_DB_MIGRATE_ONCE:-true}
      - AUTO_DB_MIGRATE_MARKER=${AUTO_DB_MIGRATE_MARKER:-/app/config/.auto-db-migrated}
      - AUTO_DB_MIGRATE_RESET_SQLITE=${AUTO_DB_MIGRATE_RESET_SQLITE:-true}
      - FITS_LIBRARY_DIR=/app/fits
      - FITS_DERIVATIVES_DIR=/app/fits-derived
      - FITS_UPLOAD_DIR=/app/fits-upload
      - FITS_ANALYSIS_DIR=/app/fits-analysis
      - FITS_CACHE_DIR=/app/cache/fits
      - FITS_MAX_PROCESS_BYTES=${FITS_MAX_PROCESS_BYTES:-1073741824}
      - ASTROVIABIN_MAX_UPLOAD_BYTES=${ASTROVIABIN_MAX_UPLOAD_BYTES:-21474836480}
      # Login. Change these before exposing AstroviaBin on a network.
      - ASTROVIABIN_ADMIN_USER=${ASTROVIABIN_ADMIN_USER:-admin}
      - ASTROVIABIN_ADMIN_PASSWORD=${ASTROVIABIN_ADMIN_PASSWORD:-admin}
      - ASTROVIABIN_SESSION_SECRET=${ASTROVIABIN_SESSION_SECRET:-}
      # Extra narrow-field index files (see download-astrometry-indexes) live in AppData.
      - ASTROMETRY_EXTRA_INDEX_DIRS=/app/config/astrometry-index
    volumes:
      - ${ASTROVIABIN_HOST_DATA:-./data/appdata}:/app/config
      - ${ASTROVIABIN_HOST_DATA:-./data/appdata}/logs:/app/logs
      - ${ASTROVIABIN_HOST_DATA:-./data/appdata}/sidecars:/app/sidecars
      - ${ASTROVIABIN_HOST_DATA:-./data/appdata}/cache:/app/cache
      - ${ASTROVIABIN_HOST_LIBRARY:-./data/media}:/app/library
      # Sources stay read-only. AstroviaBin writes derivatives separately and never edits originals.
      - ${FITS_HOST_LIBRARY:-./data/fits/library}:/app/fits:ro
      - ${FITS_HOST_DERIVATIVES:-./data/fits/derivatives}:/app/fits-derived
      - ${FITS_HOST_UPLOADS:-./data/fits/uploads}:/app/fits-upload
      - ${FITS_HOST_ANALYSIS:-./data/fits/analysis}:/app/fits-analysis
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
