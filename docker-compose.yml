# Sidereal Docker Compose Configuration (SQLite — no external database needed)
#
# Usage: docker compose up -d
#
# For PostgreSQL instead of SQLite, layer the postgres override:
#   docker compose -f docker-compose.yml -f docker-compose.postgres.yml up -d

services:
  sidereal:
    build: .
    container_name: sidereal
    restart: unless-stopped
    ports:
      - "${SIDEREAL_PORT:-5000}:5000"
    environment:
      - NODE_ENV=production
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - SQLITE_DB_PATH=/app/config/sidereal.db
      - XMP_SIDECAR_PATH=/app/sidecars
      - LIBRARY_STORAGE_DIR=/app/library
      - TILE_CACHE_DIR=/app/cache/deep-zoom
      - THUMBNAIL_CACHE_DIR=/app/cache/thumbnails
      - ASTROMETRY_INDEX_DIR=/usr/share/astrometry
      - ASTROMETRY_SCALE_LOW_ARCMIN=${ASTROMETRY_SCALE_LOW_ARCMIN:-30}
      - ASTROMETRY_SCALE_HIGH_ARCMIN=${ASTROMETRY_SCALE_HIGH_ARCMIN:-2000}
      - AUTO_DB_MIGRATE_FROM=${AUTO_DB_MIGRATE_FROM:-}
      - AUTO_DB_MIGRATE_TO=${AUTO_DB_MIGRATE_TO:-}
      - AUTO_DB_MIGRATE_ONCE=${AUTO_DB_MIGRATE_ONCE:-true}
      - AUTO_DB_MIGRATE_MARKER=${AUTO_DB_MIGRATE_MARKER:-/app/config/.auto-db-migrated}
      - AUTO_DB_MIGRATE_RESET_SQLITE=${AUTO_DB_MIGRATE_RESET_SQLITE:-true}
      - FITS_LIBRARY_DIR=/app/fits
      - FITS_DERIVATIVES_DIR=/app/fits-derived
      - FITS_UPLOAD_DIR=/app/fits-upload
      - FITS_ANALYSIS_DIR=/app/fits-analysis
      - FITS_CACHE_DIR=/app/cache/fits
      - FITS_MAX_PROCESS_BYTES=${FITS_MAX_PROCESS_BYTES:-1073741824}
      - SIDEREAL_MAX_UPLOAD_BYTES=${SIDEREAL_MAX_UPLOAD_BYTES:-21474836480}
    volumes:
      - ${SIDEREAL_HOST_DATA:-/mnt/Expansion/Sidereal/AppData}:/app/config
      - ${SIDEREAL_HOST_DATA:-/mnt/Expansion/Sidereal/AppData}/logs:/app/logs
      - ${SIDEREAL_HOST_DATA:-/mnt/Expansion/Sidereal/AppData}/sidecars:/app/sidecars
      - ${SIDEREAL_HOST_DATA:-/mnt/Expansion/Sidereal/AppData}/cache:/app/cache
      - ${SIDEREAL_HOST_LIBRARY:-/mnt/Expansion/Sidereal/Media}:/app/library
      # Sources stay read-only. Sidereal writes derivatives separately and never edits originals.
      - ${FITS_HOST_LIBRARY:-/mnt/Expansion/Sidereal/FITS/library}:/app/fits:ro
      - ${FITS_HOST_DERIVATIVES:-/mnt/Expansion/Sidereal/FITS/derivatives}:/app/fits-derived
      - ${FITS_HOST_UPLOADS:-/mnt/Expansion/Sidereal/FITS/uploads}:/app/fits-upload
      - ${FITS_HOST_ANALYSIS:-/mnt/Expansion/Sidereal/FITS/analysis}:/app/fits-analysis
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
