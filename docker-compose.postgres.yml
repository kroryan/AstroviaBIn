# PostgreSQL override for AstroviaBin
#
# Layer this on top of the base compose file to use PostgreSQL instead of SQLite:
#   docker compose -f docker-compose.yml -f docker-compose.postgres.yml up -d
#   docker compose -f docker-compose.prod.yml -f docker-compose.postgres.yml up -d
#
# Requires POSTGRES_PASSWORD set in .env or environment:
#   echo "POSTGRES_PASSWORD=your_secure_password" > .env

services:
  astroviabin:
    environment:
      - DATABASE_URL=postgresql://astroviabin:${POSTGRES_PASSWORD}@astroviabin-db:5432/astroviabin
    depends_on:
      astroviabin-db:
        condition: service_healthy
    networks:
      - astroviabin-network

  astroviabin-db:
    image: postgres:15-alpine
    container_name: astroviabin-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=astroviabin
      - POSTGRES_USER=astroviabin
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8 --lc-collate=C --lc-ctype=C
    volumes:
      - astroviabin-database:/var/lib/postgresql/data
    networks:
      - astroviabin-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U astroviabin -d astroviabin"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    # Don't expose PostgreSQL port externally for security

networks:
  astroviabin-network:
    driver: bridge

volumes:
  astroviabin-database:
    driver: local
