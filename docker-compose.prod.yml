# Sidereal Production Docker Compose Configuration (SQLite — no external database needed)
# Builds this fork locally. Upstream GHCR images do not contain its private
# local astrometry, HOTPANTS, Photutils, or native media library.
#
# Quick start:
#   docker compose -f docker-compose.prod.yml up -d
#
# For PostgreSQL instead of SQLite, layer the postgres override:
#   docker compose -f docker-compose.prod.yml -f docker-compose.postgres.yml up -d

services:
  sidereal:
    image: sidereal:local
    build: .
    container_name: sidereal
    restart: unless-stopped
    ports:
      - "${SIDEREAL_PORT:-5000}:5000"
    environment:
      - NODE_ENV=production
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - SQLITE_DB_PATH=/app/config/sidereal.db
      - XMP_SIDECAR_PATH=/app/sidecars
      - LIBRARY_STORAGE_DIR=/app/library
      - ASTROMETRY_INDEX_DIR=/usr/share/astrometry
      - FITS_LIBRARY_DIR=/app/fits
      - FITS_DERIVATIVES_DIR=/app/fits-derived
      - FITS_UPLOAD_DIR=/app/fits-upload
      - FITS_ANALYSIS_DIR=/app/fits-analysis
      - FITS_CACHE_DIR=/app/cache/fits
      - SIDEREAL_MAX_UPLOAD_BYTES=${SIDEREAL_MAX_UPLOAD_BYTES:-21474836480}
      # Login. Change these before exposing Sidereal on a network.
      - SIDEREAL_ADMIN_USER=${SIDEREAL_ADMIN_USER:-admin}
      - SIDEREAL_ADMIN_PASSWORD=${SIDEREAL_ADMIN_PASSWORD:-admin}
      - SIDEREAL_SESSION_SECRET=${SIDEREAL_SESSION_SECRET:-}
      # Extra narrow-field index files (see download-astrometry-indexes) live in AppData.
      - ASTROMETRY_EXTRA_INDEX_DIRS=/app/config/astrometry-index
      - AUTO_DB_MIGRATE_FROM=${AUTO_DB_MIGRATE_FROM:-}
      - AUTO_DB_MIGRATE_TO=${AUTO_DB_MIGRATE_TO:-}
      - AUTO_DB_MIGRATE_ONCE=${AUTO_DB_MIGRATE_ONCE:-true}
      - AUTO_DB_MIGRATE_MARKER=${AUTO_DB_MIGRATE_MARKER:-/app/config/.auto-db-migrated}
      - AUTO_DB_MIGRATE_RESET_SQLITE=${AUTO_DB_MIGRATE_RESET_SQLITE:-true}
    volumes:
      - ${SIDEREAL_HOST_DATA:-./data/appdata}:/app/config
      - ${SIDEREAL_HOST_DATA:-./data/appdata}/logs:/app/logs
      - ${SIDEREAL_HOST_DATA:-./data/appdata}/sidecars:/app/sidecars
      - ${SIDEREAL_HOST_DATA:-./data/appdata}/cache:/app/cache
      - ${SIDEREAL_HOST_LIBRARY:-./data/media}:/app/library
      - ${FITS_HOST_LIBRARY:-./data/fits/library}:/app/fits:ro
      - ${FITS_HOST_DERIVATIVES:-./data/fits/derivatives}:/app/fits-derived
      - ${FITS_HOST_UPLOADS:-./data/fits/uploads}:/app/fits-upload
      - ${FITS_HOST_ANALYSIS:-./data/fits/analysis}:/app/fits-analysis
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
